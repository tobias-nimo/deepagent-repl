[project]
name = "deepagent-tui"
version = "0.1.0"
description = "Terminal UI for any LangChain Deep Agent server"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "langgraph-sdk>=0.3.11",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "textual>=0.85",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
deepagent = "deepagent_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagent_tui"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Coverage is opt-in: a plain `uv run pytest` stays fast and never fails on a
# coverage threshold (so `-k <filter>` runs work). CI runs `pytest --cov` to
# enforce the gate below. The gate is scoped to the pure-logic layer — the
# parts that are cheap and worthwhile to keep green — rather than the whole
# app; UI glue in tui/ and the IO-coupled command bodies are exercised by the
# app/cli tests but intentionally left out of the number. See docs/testing.md.
[tool.coverage.run]
branch = true
source = ["deepagent_tui"]

[tool.coverage.report]
show_missing = true
fail_under = 85
include = [
    "*/deepagent_tui/handlers/*",
    "*/deepagent_tui/utils/*",
    "*/deepagent_tui/storage/*",
    "*/deepagent_tui/session.py",
    "*/deepagent_tui/ui/tool_widgets.py",
    "*/deepagent_tui/commands/__init__.py",
]
